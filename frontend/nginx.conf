server {
  listen 80;
  root /usr/share/nginx/html;
  charset utf-8;
  absolute_redirect off;  # redireciona com caminho relativo: mantém a porta e o host de quem acessou

  # Cabeçalhos de segurança (os mesmos de vercel.json). nginx não herda add_header em blocos que têm o seu próprio:
  # por isso o include se repete em cada location com Cache-Control.
  include /etc/nginx/conf.d/security.inc;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/markdown;

  # --- App (Vite, base /app/) ---------------------------------------------------------------------
  location = /app {
    return 301 /app/;
  }
  # Arquivos com hash no nome: cache longo.
  location /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/security.inc;
    try_files $uri =404;
  }
  # Sequência do hero da landing (docs/HERO-360.md): pasta versionada (v1, v2...), nomes fixos dentro dela.
  # Arquivo ausente responde 404 (nunca o index.html do app), para o carregador cair no quadro mais próximo.
  location /app/hero-360/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/security.inc;
    try_files $uri =404;
  }
  # Manifesto do app (PWA): tipo MIME que o navegador exige.
  location ~ \.webmanifest$ {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security.inc;
  }
  # Rotas por hash: recarregar e links diretos (/app/#/login...) sempre caem no index.html do app.
  location /app/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security.inc;
    try_files $uri /app/index.html;
  }

  location /api/ {
    client_max_body_size 3m;  # upload da logo (o backend recusa acima de 2 MB com mensagem clara)
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # --- Landing (estática, em /) --------------------------------------------------------------------
  # Imagens e fonte sem hash no nome: cache de 1 dia (trocar o nome do arquivo ao mudar o conteúdo).
  location /assets/ {
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/conf.d/security.inc;
    try_files $uri =404;
  }
  location ~ \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security.inc;
  }
  # HTML, CSS, JS e dados geográficos: revalida a cada visita (ETag; resposta 304 quando não mudou).
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security.inc;
    try_files $uri $uri/ =404;
  }
}
